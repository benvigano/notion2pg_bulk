[project]
name = "notion2pg-bulk"
version = "0.2.0"
description = "Snapshot an entire Notion workspace into a PostgreSQL database."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.1,<4",
    "sqlalchemy>=2.0.0,<3",
]
authors = [
    { name = "benvigano" }
]
license = { text = "GPL-3.0-or-later" }
keywords = ["notion", "postgresql", "snapshot", "backup", "database", "export", "workspace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/benvigano/notion2pg_bulk"
Repository = "https://github.com/benvigano/notion2pg_bulk"
Issues = "https://github.com/benvigano/notion2pg_bulk/issues"

[project.scripts]
notion2pg-bulk = "notion2pg_bulk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"
